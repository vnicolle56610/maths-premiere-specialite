# Devoirs blancs publiés dans la rubrique « Préparer une évaluation ».
#
# Seuls les devoirs blancs vont sur le site, jamais les sujets ni les
# corrigés des évaluations réelles. Rien n'est publié tant qu'une entrée
# n'est pas déclarée ici, et c'est le professeur qui fait avancer « etat » :
#
#   non_publie        rien n'apparaît sur le site
#   annonce           annoncée dans « À venir » (date, format, notions),
#                     sans document : pour que les élèves se projettent
#   sujet             devoir blanc en ligne (fiche + sujet), corrigé annoncé
#   sujet_et_corrige  devoir blanc et corrigé en ligne
#   sans_devoir_blanc évaluation passée sans devoir blanc (MT1, oct. 2026) :
#                     seul le bloc « Après l'évaluation » apparaît
#
# Une fois l'évaluation passée, l'entrée reste : elle passe dans
# « Pour réviser — évaluations passées ». Ne pas la supprimer.
#
# Dates : celles du message Pronote (MESSAGE_ELEVES_<id>.md). Le script
# signale un retard sur sujet_prevu / corrige_prevu sans rien publier seul.
# dossier : relatif à la source déclarée dans config_site.yaml.
#
# Puis lancer : ./scripts/lancer_publication.sh

devoirs_blancs:
  # MT1 : seule évaluation sans devoir blanc (avant la règle du 17/10/2026).
  # État « sans_devoir_blanc » : l'entrée n'apparaît que par son bloc
  # « Après l'évaluation » (vrais sujets, fiches R/C/A, corrigés).
  - id: MT1
    date: 2026-10-07
    duree: 30 min
    calculatrice: interdite
    notions: [N01, N02, N03]
    dossier: Evaluations/MINITESTS/MINITEST_1_N01_N03
    etat: sans_devoir_blanc
    apres_evaluation:
      etat: publie
      rattrapages_termines: true
      dossier: Evaluations/MINITESTS/MINITEST_1_N01_N03/apres_evaluation
      rubriques:
        - titre: 📝 Le mini-test
          documents:
            - {fichier: MINITEST_1_N01_N03_SUJET_A.pdf, libelle: sujet A}
            - {fichier: MINITEST_1_N01_N03_SUJET_B.pdf, libelle: sujet B}
            - {fichier: MINITEST_1_N01_N03_SUJET_A_CORRIGE.pdf, libelle: corrigé A}
            - {fichier: MINITEST_1_N01_N03_SUJET_B_CORRIGE.pdf, libelle: corrigé B}
        - titre: 🔁 Retravailler
          documents:
            - {fichier: FICHE_R_REMEDIATION_MT1_1S.pdf, libelle: parcours R — Reprendre}
            - {fichier: FICHE_C_REMEDIATION_MT1_1S.pdf, libelle: parcours C — Consolider}
            - {fichier: FICHE_A_REMEDIATION_MT1_1S.pdf, libelle: parcours A — Approfondir}
        - titre: ✔️ Corrigés détaillés
          documents:
            - {fichier: CORRIGE_FICHE_R_REMEDIATION_MT1_1S.pdf, libelle: parcours R}
            - {fichier: CORRIGE_FICHE_C_REMEDIATION_MT1_1S.pdf, libelle: parcours C}
            - {fichier: CORRIGE_FICHE_A_REMEDIATION_MT1_1S.pdf, libelle: parcours A}
      conseil: >-
        Quelle fiche prendre ? Le parcours indiqué en classe. Sinon : R si l'équation et
        l'inéquation (questions B-2 et B-3) n'étaient pas réussies, C si une seule l'était,
        A si les deux l'étaient. Utile avant le DS1 : résoudre une inéquation jusqu'à
        l'ensemble des solutions. Ne lisez le corrigé qu'après avoir cherché.

  - id: MT2
    date: 2026-11-09
    duree: 30 min
    calculatrice: interdite
    notions: [N03, N04, N05]
    dossier: Evaluations/MINITESTS/MT2_N03_N05_2026_11_09
    sujet: DEVOIR_BLANC_MT2_1S.pdf
    corrige: CORRIGE_DEVOIR_BLANC_MT2_1S.pdf
    sujet_prevu: 2026-11-02
    corrige_prevu: 2026-11-06
    etat: sujet_et_corrige
    # À publier après la séance de reprise en classe et les rattrapages.
    apres_evaluation:
      etat: publie
      rattrapages_termines: true
      dossier: Evaluations/MINITESTS/MT2_N03_N05_2026_11_09/apres_evaluation
      rubriques:
        - titre: 📝 Le mini-test
          documents:
            - {fichier: MT2_1S_SUJET_A.pdf, libelle: sujet A}
            - {fichier: MT2_1S_SUJET_B.pdf, libelle: sujet B}
            - {fichier: CORRIGE_MT2_1S_SUJET_A.pdf, libelle: corrigé A}
            - {fichier: CORRIGE_MT2_1S_SUJET_B.pdf, libelle: corrigé B}
        - titre: 🔁 Retravailler
          documents:
            - {fichier: FICHE_REPRISE_MT2_1S.pdf, libelle: fiche de reprise « Lire un tableau de variations »}
        - titre: ✔️ Corrigé détaillé
          documents:
            - {fichier: FICHE_REPRISE_MT2_1S_CORRIGE.pdf, libelle: fiche de reprise}
      conseil: >-
        La fiche de reprise travaille la confusion la plus fréquente du mini-test : les
        valeurs de x (ligne du haut du tableau) et les valeurs de f(x) (flèches). Ne lisez
        le corrigé qu'après avoir cherché.

  - id: DS1
    date: 2026-11-23
    duree: 80 min
    calculatrice: interdite
    notions: [N01, N02, N04, N05, N06]
    dossier: Evaluations/DS/DS1_N01_N05_2026_11_23
    sujet: DEVOIR_BLANC_DS1_1S.pdf
    corrige: CORRIGE_DEVOIR_BLANC_DS1_1S.pdf
    sujet_prevu: 2026-11-16
    corrige_prevu: 2026-11-19
    etat: sujet_et_corrige
